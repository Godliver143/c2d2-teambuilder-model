# Render Blueprint — native Python (recommended for Free tier).
# Docker image builds often hit OOM on small builders; native `pip` is usually lighter.
# Deploy uses the repo root checkout, then `cd "Combat Mission Model"` — avoids blueprint
# `rootDir` for paths with spaces (some pipelines mis-parse or omit files).
# `Combat Mission Model/Dockerfile` stays for local / other container hosts.
#
# Docs: https://docs.render.com/docs/blueprint-spec

services:
  - type: web
    name: combat-mission-api
    runtime: python
    branch: main
    plan: free
    region: oregon
    buildCommand: cd "Combat Mission Model" && python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-cache-dir -r requirements-docker.txt
    startCommand: cd "Combat Mission Model" && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        value: "*"
